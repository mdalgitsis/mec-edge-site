name: validate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the Edge-API specification
        run: npx --yes @redocly/cli@latest lint api/edge-api.yaml --format stylish

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that every relative link and image resolves
        run: ./scripts/check-links.sh
